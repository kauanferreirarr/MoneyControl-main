<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>if(localStorage.getItem('mc_theme')==='dark')document.documentElement.classList.add('dark')</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Criar conta - MoneyControl</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MoneyControl">
    <meta name="application-name" content="MoneyControl">
    <meta name="description" content="Comece a controlar suas finanças agora.">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/pwa.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
    <div class="login-wrapper">
        <!-- Lado esquerdo - Branding -->
        <div class="login-branding">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1v22"></path>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <h1>MoneyControl</h1>
            <p>Comece a controlar suas finanças agora</p>
            <div class="brand-features">
                <div class="brand-feature">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span>Grátis e sem complicação</span>
                </div>
                <div class="brand-feature">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Seus dados seguros</span>
                </div>
                <div class="brand-feature">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Configure em menos de 1 minuto</span>
                </div>
            </div>
        </div>

        <!-- Lado direito - Formulario -->
        <div class="login-form-side">
            <div class="login-header">
                <h2>Crie sua conta</h2>
                <p>Preencha seus dados para começar</p>
            </div>
            
            <form class="create-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
                    </div>
                </div>
                
                <div id="feedback" class="feedback"></div>
                
                <button type="submit" id="btn-registrar" class="login-btn botao-criar">Criar conta</button>
            </form>
            
            <div class="divider">ou</div>
            
            <button type="button" id="btn-google-registrar" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Criar conta com Google
            </button>
            
            <div class="signup-link">
                Já tem uma conta? <a href="login.html">Faça seu login</a>
            </div>
        </div>
    </div>

    <!-- Footer info -->
    <div class="login-footer">
        <div class="footer-links">
            <a href="#">Termos de Uso</a>
            <a href="#">Politica de Privacidade</a>
            <a href="ajuda.html">Ajuda</a>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/dark-mode.js"></script>
</body>
</html>
